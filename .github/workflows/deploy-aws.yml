# Deploys Muxaris to AWS (account 005533348545, ap-south-1) on every push to main.
#
# NOT YET EXECUTED: this branch has never been pushed and main only holds the Astro site, so this
# workflow has not run anywhere and is unverified. Expect to debug it on its first real run.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN   output DeployRoleArn of the MuxarisCicd stack
#   COGNITO_USER_POOL_ID  Cognito user pool id
#   COGNITO_CLIENT_ID     Cognito app client id
#   CERT_ARN              ACM certificate ARN for the ALB HTTPS listener
#   NOTIFY_FROM_EMAIL     SES sender address
#   ALARM_EMAIL           alarm notification recipient
#   BILLING_ENABLED       "1" to enable billing, anything else for off
# No repository secrets are needed: AWS access is through GitHub OIDC (id-token: write).
name: deploy-aws
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: deploy-aws
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      CDK_DEFAULT_ACCOUNT: "005533348545"
      CDK_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - id: tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.tag.outputs.value }}
          tags: ${{ steps.ecr.outputs.registry }}/muxaris-api:${{ steps.tag.outputs.value }}
      - name: Build and push voice gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/voice-gateway/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.tag.outputs.value }}
          tags: ${{ steps.ecr.outputs.registry }}/muxaris-voice-gateway:${{ steps.tag.outputs.value }}
      - name: CDK deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          CERT_ARN: ${{ vars.CERT_ARN }}
          COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
        run: >-
          npm run cdk -w @muxaris/infra -- deploy
          MuxarisData MuxarisWorkers MuxarisServices MuxarisObservability
          --require-approval never
      - name: Run migrations
        run: bash scripts/migrate.sh
      - name: Smoke test
        run: |
          ALB_URL="http://$(aws cloudformation describe-stacks --stack-name MuxarisServices \
            --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" --output text)"
          bash scripts/smoke.sh "$ALB_URL"
