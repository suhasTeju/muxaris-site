# Deploys Muxaris to AWS (account 005533348545, ap-south-1) after CI passes on main.
#
# NOT YET EXECUTED: this branch has never been pushed and main only holds the Astro site, so this
# workflow has not run anywhere and is unverified. Expect to debug it on its first real run.
#
# Triggered by the `ci` workflow completing on main (a red CI never deploys), or by hand. The
# `changes` job diffs the tested commit against the commit currently running on the API service (its
# image tag) and skips the deploy when only web, docs or Markdown changed, so a site-only push does
# not replace the gateway. (`paths-ignore` cannot apply to `workflow_run`.)
#
# Order: Data, Workers, Migrate, scripts/migrate.sh, then Services and Observability, so new code
# never meets the old schema.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN   output DeployRoleArn of the MuxarisCicd stack
#   COGNITO_USER_POOL_ID  Cognito user pool id
#   COGNITO_CLIENT_ID     Cognito app client id
#   CERT_ARN              ACM certificate ARN for the ALB HTTPS listener; when empty the deploy
#                         runs with ALLOW_HTTP_ONLY=1 and the smoke test uses the ALB http URL
#   NOTIFY_FROM_EMAIL     SES sender address
#   ALARM_EMAIL           alarm notification recipient
#   BILLING_ENABLED       "1" to enable billing, anything else for off
#   TELEPHONY_PROVIDER    "twilio" to turn phone calls on, empty for off
# No repository secrets are needed: AWS access is through GitHub OIDC (id-token: write).
name: deploy-aws
# workflow_run runs with this repo's OIDC identity, so the first job only accepts a green push CI run
# from this repository's own main branch (a fork branch named main must not reach the deploy).
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: deploy-aws
  cancel-in-progress: false
jobs:
  changes:
    # Decides whether anything since the currently deployed commit needs a deploy. A push can carry
    # several commits, so the diff runs from the deployed commit (the API service's image tag), not
    # from the head commit's parent. Unknown deployed state always deploys.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - id: diff
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -z "$HEAD_SHA" ]]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          svc="$(aws ecs list-services --cluster muxaris --query 'serviceArns' --output text | tr '\t' '\n' | grep ApiService || true)"
          td="$(aws ecs describe-services --cluster muxaris --services "$svc" --query 'services[0].taskDefinition' --output text 2>/dev/null || true)"
          image="$(aws ecs describe-task-definition --task-definition "$td" --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || true)"
          deployed="${image##*:}"
          if [[ -z "$deployed" || "$deployed" == "None" ]] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "deployed commit unknown ($deployed): deploying"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files="$(git diff --name-only "$deployed" "$HEAD_SHA")"
          echo "changed since deployed $deployed:"; echo "$files"
          # Anything outside web, docs, Markdown and netlify.toml needs a deploy.
          if grep -qvE '^(apps/web/|docs/|netlify\.toml$)|\.md$' <<<"$files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "only web or docs changed since the deployed commit: nothing to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      CDK_DEFAULT_ACCOUNT: "005533348545"
      CDK_DEFAULT_REGION: ap-south-1
      COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      CERT_ARN: ${{ vars.CERT_ARN }}
      # Only the deliberate HTTP-only state (no certificate yet) may deploy without CERT_ARN.
      ALLOW_HTTP_ONLY: ${{ vars.CERT_ARN == '' && '1' || '' }}
      NOTIFY_FROM_EMAIL: ${{ vars.NOTIFY_FROM_EMAIL }}
      ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
      TELEPHONY_PROVIDER: ${{ vars.TELEPHONY_PROVIDER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build:packages
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - id: tag
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "value=${sha::7}" >> "$GITHUB_OUTPUT"
      # Tags are immutable and builds are not reproducible: an image that already exists (from a
      # run that failed later) is reused, so "Re-run jobs" works.
      - id: exists
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          for repo in muxaris-api muxaris-voice-gateway; do
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
              echo "$repo=true" >> "$GITHUB_OUTPUT"
            else
              echo "$repo=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push API image
        if: steps.exists.outputs.muxaris-api != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.tag.outputs.value }}
          tags: ${{ steps.ecr.outputs.registry }}/muxaris-api:${{ steps.tag.outputs.value }}
      - name: Build and push voice gateway image
        if: steps.exists.outputs.muxaris-voice-gateway != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/voice-gateway/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ steps.tag.outputs.value }}
          tags: ${{ steps.ecr.outputs.registry }}/muxaris-voice-gateway:${{ steps.tag.outputs.value }}
      - name: CDK deploy Data, Workers, Migrate
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: >-
          npm run cdk -w @muxaris/infra -- deploy
          MuxarisData MuxarisWorkers MuxarisMigrate
          --require-approval never
      - name: Run migrations
        run: bash scripts/migrate.sh
      - name: CDK deploy Services, Observability
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: >-
          npm run cdk -w @muxaris/infra -- deploy
          MuxarisServices MuxarisObservability
          --require-approval never
      - name: Smoke test
        run: |
          # With a certificate port 80 is a bare redirect and the cert is for the real hostname,
          # so smoke the public HTTPS URL; before the certificate exists use the ALB over http.
          if [[ -n "${CERT_ARN}" ]]; then
            BASE="https://api.muxaris.com"
          else
            BASE="http://$(aws cloudformation describe-stacks --stack-name MuxarisServices \
              --query "Stacks[0].Outputs[?OutputKey=='AlbDnsName'].OutputValue" --output text)"
          fi
          bash scripts/smoke.sh "$BASE"
