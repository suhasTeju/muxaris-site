[build]
  # Repo root, so the workspace packages (@muxaris/shared, @muxaris/voice-sdk) can be built first.
  base = "/"
  command = "npm run build:packages && npm run build -w @muxaris/web"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

# Required env vars (set in the Netlify UI; see README "Deploy (Netlify)"):
#   NEXT_PUBLIC_COGNITO_USER_POOL_ID, NEXT_PUBLIC_COGNITO_CLIENT_ID, NEXT_PUBLIC_COGNITO_DOMAIN,
#   NEXT_PUBLIC_API_URL, NEXT_PUBLIC_VOICE_WS_URL (wss), NEXT_PUBLIC_GOOGLE_ENABLED
# The two URLs the site needs from the AWS deploy (docs/RUNBOOK.md):
#   NEXT_PUBLIC_API_URL=https://api.muxaris.com
#   NEXT_PUBLIC_VOICE_WS_URL=wss://voice.muxaris.com

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
