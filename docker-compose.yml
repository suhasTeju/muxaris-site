services:
  postgres:
    image: postgres:16-alpine
    container_name: muxaris-postgres
    environment:
      POSTGRES_USER: muxaris
      POSTGRES_PASSWORD: muxaris
      POSTGRES_DB: muxaris
    ports:
      - "5433:5432"
    volumes:
      - muxaris-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muxaris"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  muxaris-pg:
